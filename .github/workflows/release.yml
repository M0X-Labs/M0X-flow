name: Automated Release Build

on:
  push:
    tags:
      - 'v*' # Triggers automatically when pushing a version tag (e.g. v0.1.0, v1.0.0)
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version tag for manual release (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'

jobs:
  build-and-release:
    name: Build & Publish Release Installer
    runs-on: windows-latest

    permissions:
      contents: write # Grant permission to create GitHub Releases and upload binaries

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Build Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Python Sidecar Executable
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller fastapi "uvicorn[standard]" pydantic huggingface_hub psutil
          if (Test-Path backend-sidecar/requirements.txt) { pip install -r backend-sidecar/requirements.txt }
          Set-Location backend-sidecar
          pyinstaller pyinstaller.spec --clean -y
          Set-Location ..
          New-Item -ItemType Directory -Force -Path src-tauri/binaries
          Copy-Item backend-sidecar/dist/backend-sidecar.exe src-tauri/binaries/backend-sidecar-x86_64-pc-windows-msvc.exe -Force
          Write-Host "Sidecar binary successfully created at src-tauri/binaries/backend-sidecar-x86_64-pc-windows-msvc.exe"
        shell: powershell

      - name: Build React Frontend & Tauri App
        run: npm run build:app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Organize Release Binaries & Installers
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts
          
          # Copy NSIS Setup Executable (.exe)
          if (Test-Path src-tauri/target/release/bundle/nsis/*.exe) {
            Copy-Item src-tauri/target/release/bundle/nsis/*.exe release-artifacts/ -Force
          }
          
          # Copy MSI Windows Installer (.msi)
          if (Test-Path src-tauri/target/release/bundle/msi/*.msi) {
            Copy-Item src-tauri/target/release/bundle/msi/*.msi release-artifacts/ -Force
          }
          
          # Copy Portable Executable (.exe)
          if (Test-Path src-tauri/target/release/m0x-flow.exe) {
            Copy-Item src-tauri/target/release/m0x-flow.exe release-artifacts/m0x-flow-portable.exe -Force
          }

          Write-Host "Collected files for release:"
          Get-ChildItem release-artifacts/
        shell: powershell

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name != 'main' && github.ref_name != 'master' && github.ref_name || inputs.release_version || 'v0.1.0' }}
          name: m0x-flow Release ${{ github.ref_name != 'main' && github.ref_name != 'master' && github.ref_name || inputs.release_version || 'v0.1.0' }}
          files: |
            release-artifacts/*.exe
            release-artifacts/*.msi
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
